name: PNPM Build Check

permissions:
  pull-requests: write
  contents: read
  issues: write

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  npm-build:
    name: Build with Node.js LTS
    runs-on: ubuntu-latest

    outputs:
      node_version: ${{ steps.get-node-version.outputs.node_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS (and enable pnpm cache)
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup pnpm (guarantee pnpm on PATH)
        uses: pnpm/action-setup@v2
        with:
          version: "latest" # or '8' or specific version like '8.13.0'

      - name: Verify tools (debug)
        run: |
          echo "node: $(node -v)"
          echo "npm: $(npm -v)"
          echo "pnpm: $(pnpm -v)"

      - name: Capture Node version to output
        id: get-node-version
        run: |
          echo "node_version=$(node -v)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

  post-success-review:
    if: success() && github.event_name == 'pull_request'
    needs: npm-build
    runs-on: ubuntu-latest
    steps:
      - name: Post build success review (PR)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) return;

            const prNumber = pr.number;
            const nodeVersion = process.env.NODE_VERSION || 'unknown';
            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: "COMMENT",
              body: `✅ Build passed on **${nodeVersion}**. Good to merge.`
            });
        env:
          NODE_VERSION: ${{ needs.npm-build.outputs.node_version }}

  notify-on-failure:
    if: failure()
    needs: npm-build
    runs-on: ubuntu-latest
    steps:
      - name: Notify on build failure (PR or push)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const nodeVersion = process.env.NODE_VERSION || 'unknown';

            if (pr) {
              const prNumber = pr.number;
              const user = pr.user.login;

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: "REQUEST_CHANGES",
                body: `❌ Build failed on **${nodeVersion}**.\n\n@${user}, please fix the issues in the pipeline.`
              });
            } else {
              const pusher = context.payload.pusher ? context.payload.pusher.name : 'unknown';

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Build failed on main branch',
                body: `❌ Build failed on **${nodeVersion}**.\n\n@${pusher}, please investigate and fix the issue.`,
                labels: ['ci-failure', 'automated'],
              });
            }
        env:
          NODE_VERSION: ${{ needs.npm-build.outputs.node_version }}
