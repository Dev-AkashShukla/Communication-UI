name: PR Build Check

on:
  pull_request:
    branches: ["main"]

permissions:
  pull-requests: write
  contents: read
  issues: write

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Debug pnpm install
        run: |
          echo "PATH:"
          echo $PATH
          echo "pnpm location:"
          which pnpm || echo "pnpm not found"
          echo "pnpm version:"
          pnpm --version || echo "pnpm not installed"

      - name: Install dependencies
        run: pnpm install

      - name: Run build
        run: pnpm run build

  post-success-review:
    if: success() && github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Post build success review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            const prNumber = pr.number;

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              event: "COMMENT",
              body: `✅ Build passed successfully. Good to merge.`
            });

  notify-on-failure:
    if: failure()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Notify on build failure
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;

            if (pr) {
              const prNumber = pr.number;
              const user = pr.user.login;

              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                event: "REQUEST_CHANGES",
                body: `❌ Build failed.\n\n@${user}, please fix the issues in the pipeline.`
              });
            } else {
              const pusher = context.payload.pusher ? context.payload.pusher.name : 'unknown';

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '🚨 Build failed on main branch',
                body: `❌ Build failed.\n\n@${pusher}, please investigate and fix the issue.`,
                labels: ['ci-failure', 'automated'],
              });
            }
